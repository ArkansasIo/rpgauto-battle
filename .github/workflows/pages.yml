name: Build static browser demo

on:
  push:
    branches: [main]
    paths:
      - 'docs/pages/**'
      - 'docs/GITHUB_PAGES.md'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/pages/**'
      - 'docs/GITHUB_PAGES.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify static site
        run: |
          test -f docs/pages/index.html
          test -f docs/pages/style.css
          test -f docs/pages/game.js
          node --check docs/pages/game.js
      - name: Package static site
        run: |
          mkdir -p site
          cp -R docs/pages/. site/
          touch site/.nojekyll
          cat > site/404.html <<'EOF'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found — Mo RPG Hero</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090e17;color:#e8edf6;font:16px system-ui;text-align:center}a{color:#dfb765}</style><main><h1>404 — Trail Lost</h1><p>This path isn't on the map.</p><p><a href="./">Return to Mo RPG Hero</a></p></main></html>
          EOF
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
